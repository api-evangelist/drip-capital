name: Drip Capital
description: 'Drip Capital is a digital trade finance and working capital company founded
  in 2016, headquartered in Palo Alto, California, with operations in Mumbai, India
  and Mexico City, Mexico. It provides collateral-free post-shipment finance to small
  and medium-sized exporters and importers through data-driven underwriting, offering
  invoice factoring, export finance, an importer credit program, supply chain and vendor
  financing, receivables financing, and revolving lines of credit. The company has
  financed over $9 billion in trade transactions for 11,000+ businesses worldwide.
  Drip Capital does not currently publish a public developer API; this profile captures
  its identity and public web properties. It was surfaced as a portfolio company of
  Accel, Initialized Capital, Wing Venture Capital, and Y Combinator.'
